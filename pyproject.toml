[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-alpha-engine"
version = "1.2.0"
description = "Read-only Solana memecoin discovery, risk analysis and Discord callout engine"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0",
  "discord.py>=2.3,<3",
  "websockets>=12",
  "base58>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
northstar = "northstar.cli:main"

[tool.setuptools.packages.find]
include = ["northstar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real public APIs (opt-in with NORTHSTAR_LIVE_TESTS=1); never posts to Discord"]
